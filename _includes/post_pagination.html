<div class="divider"></div>
<div style="display:flex;justify-content:space-between;font-size:0.82rem;">
    {% if page.previous.url %}
    <a href="{{page.previous.url}}" class="back-link" style="margin-bottom:0;">← Previous</a>
    {% else %}<span></span>{% endif %}
    {% if page.next.url %}
    <a href="{{page.next.url}}" class="back-link" style="margin-bottom:0;">Next →</a>
    {% else %}<span></span>{% endif %}
</div>
