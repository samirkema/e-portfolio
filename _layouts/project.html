<!DOCTYPE html>
<html lang="en">
{% include head.html %}

<body class="text-gray-700 bg-gray-50 dark:bg-zinc-900 dark:text-gray-200">
    <main class="px-5 mx-auto mb-10 w-full md:px-0" aria-label="Content">
        <div class="flex flex-col justify-center mt-10 space-x-0 md:flex-row md:space-x-28">
            {% include aside.html %}
            <div class="md:w-1/3">
                <a href="{{ site.baseurl }}/projects/" class="back-link">← All projects</a>
                <div class="project-detail-header">
                    <h1 style="font-size:1.6rem;font-weight:800;color:#111827;margin-bottom:0.5rem;" class="dark-title">{{ page.title }}</h1>
                    <div class="project-detail-meta">
                        <span class="project-meta-tag">📅 Started: {{ page.started }}</span>
                        <span class="project-meta-tag">⚡ Status: {{ page.status }}</span>
                        {% if page.uri %}<a href="{{ page.uri }}" target="_blank" rel="noopener noreferrer" class="project-detail-link">🔗 {{ page.uri_h }}</a>{% endif %}
                    </div>
                </div>
                <div class="prose prose-sm md:prose dark:prose-invert dark:prose-headings:text-gray-200 dark:prose-p:text-gray-300 dark:prose-li:text-gray-300 dark:prose-strong:text-gray-200 dark:prose-td:text-gray-300 prose-headings:text-gray-800 prose-a:text-blue2-600 dark:prose-a:text-emerald-400">
                    {{ content }}
                </div>
            </div>
        </div>
    </main>
</body>

</html>
