<!DOCTYPE html>
<html lang="en">
{% include head.html %}

<body class="text-gray-700 bg-gray-50 dark:bg-zinc-900 dark:text-gray-200">
    <main class="px-5 mx-auto mb-10 w-full md:px-0" aria-label="Content">
        <div class="flex flex-col justify-center mt-10 space-x-0 md:flex-row md:space-x-28">
            {% include aside.html %}
            <div class="md:w-1/3">
                <a href="{{ site.baseurl }}/" class="back-link">← Back to blog</a>
                <div style="margin-bottom:1.5rem;">
                    <p style="font-size:0.75rem;color:#9ca3af;margin-bottom:0.3rem;">
                        {{ page.date | date: "%B %d, %Y" }} · {{ page.category | capitalize }}
                    </p>
                    <h1 style="font-size:1.6rem;font-weight:800;color:#111827;line-height:1.2;" class="dark-title">{{ page.title }}</h1>
                </div>
                <div class="prose prose-sm md:prose dark:prose-invert dark:prose-headings:text-gray-200 dark:prose-p:text-gray-300 dark:prose-li:text-gray-300 dark:prose-strong:text-gray-200 prose-headings:text-gray-800 prose-a:text-blue2-600 dark:prose-a:text-emerald-400 prose-img:rounded-lg">
                    {{ content }}
                </div>
                {% include post_pagination.html %}
            </div>
        </div>
    </main>
</body>

</html>
